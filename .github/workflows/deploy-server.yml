name: Deploy to Server (website.bekyapay.com)

on:
  push:
    branches: [revamp/nextjs]
  workflow_dispatch:

concurrency:
  group: deploy-server
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL || 'https://api.bekyapay.com' }}

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/id_ed25519
          echo "${{ secrets.SERVER_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519

      # pm2 "website" serves /root/BekiaWebsite/out directly, so no restart is needed
      - name: Upload build
        run: |
          rsync -az --delete-after --delay-updates out/ \
            "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/root/BekiaWebsite/out/"
